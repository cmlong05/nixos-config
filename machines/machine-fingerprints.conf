# portable-chen 的机器表：物理网卡 MAC -> specialisation。
#
# 只有 mac 参与认机器，按原始地址精确匹配；一个段可以写多个 mac。
# 本机有多个 MAC 同时命中不同机器时会报冲突并拒绝猜测。
#
# model / board / cpu 是展示特征，只用于 which-spec、--probes 和人工排障，
# 不参与匹配。CPU 型号、整机型号都可能被多台机器共用，不要再拿来认机器。
#
# 用 scripts/detect-machine.sh --probes 获取本机物理网卡 MAC。
# 优先使用 addr_assign_type=0 的永久地址；MAC 可伪造，只用于认机器，不是安全认证。
# ⚠ 原始 MAC 会直接出现在本文件中。
#
# 加一台机器：增加一个 [机器名] 段，并在 machine_spe.nix 里增加同名变体。

# chen 笔记本：AMD 4800H + NVIDIA 3060
[chen-laptop-amd]
model = Jiaolong Series GM5NG0O
board = GM5NG0O
cpu = AMD Ryzen 7 4800H with Radeon Graphics
# TODO: 在这台机器上运行 `scripts/detect-machine.sh --probes`，
#       把物理网卡 MAC 补到这里；没有 MAC 时不会按型号猜测。

# chen 台式机：AMD 3900XT + NVIDIA 3060
[chen-desktop]
model = System Product Name
board = TUF GAMING X570-PLUS (WI-FI)
cpu = AMD Ryzen 9 3900XT 12-Core Processor
# 板载有线网卡（addr_assign_type=0）。
mac = 3c:7c:3f:50:d8:3f

